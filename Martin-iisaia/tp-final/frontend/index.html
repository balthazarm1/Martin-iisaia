<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndieStream</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="app-header">
        <h1 class="logo">Indie<span>Stream</span></h1>
        <label class="nickname">
            <span>Tu nickname</span>
            <input id="nickname-input" type="text" maxlength="30" placeholder="ej. juan" autocomplete="off">
        </label>
    </header>

    <div id="error-banner" class="error-banner" role="alert" hidden>
        <span id="error-message"></span>
        <button id="error-close" type="button" aria-label="Cerrar">✕</button>
    </div>

    <main id="view" aria-live="polite"></main>

    <footer id="player-bar" class="player-bar">
        <button id="player-toggle" class="player-toggle" type="button" disabled aria-label="Reproducir">▶</button>
        <div class="player-info">
            <strong id="player-title">Nada sonando</strong>
            <span id="player-artist">Elegí una canción del catálogo</span>
        </div>
        <audio id="audio" preload="none" controls></audio>
    </footer>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
