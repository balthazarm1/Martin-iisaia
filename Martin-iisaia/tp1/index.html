<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam - Recuperación de cuenta</title>
    <style>
        /* Estética clon de Steam */
        body {
            font-family: Arial, sans-serif;
            background-color: #1b2838;
            color: #c7d5e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #171a21;
            padding: 30px;
            width: 450px;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        h2 {
            color: #ffffff;
            margin-top: 0;
            text-transform: uppercase;
            font-size: 1.2em;
            letter-spacing: 2px;
            border-bottom: 1px solid #2a475e;
            padding-bottom: 10px;
        }
        
        /* Paso 1: Formulario */
        #paso-formulario { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; }
        input[type="text"], input[type="email"] {
            width: 95%;
            padding: 10px;
            background-color: #323e4c;
            border: none;
            color: #ffffff;
            border-radius: 2px;
            outline: none;
        }
        input:focus { background-color: #3c4958; }
        
        button {
            background: linear-gradient(to right, #47bfff 5%, #1a44c2 60%);
            background-position: 25%;
            background-size: 330% 100%;
            border: none;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 2px;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
            transition: background-position 0.3s;
        }
        button:hover { background-position: 0%; }
        button:disabled { filter: grayscale(100%); cursor: not-allowed; opacity: 0.6; }

        /* Paso 2: Captcha SVG */
        #paso-captcha { display: none; }
        .objetivo-box {
            background-color: #2a475e;
            padding: 10px;
            text-align: center;
            font-size: 1.2em;
            letter-spacing: 5px;
            border-radius: 2px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #ffffff;
        }

        /* Control Slider (Agencia del usuario) */
        .controles-slider {
            margin-bottom: 15px;
            text-align: center;
        }
        .controles-slider label {
            color: #8f98a0;
            font-weight: bold;
            font-size: 0.9em;
        }
        input[type="range"] {
            width: 80%;
            margin: 10px 0;
            accent-color: #66c0f4;
            cursor: pointer;
        }
        input[type="range"]:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .slider-labels {
            display: flex;
            justify-content: space-between;
            width: 80%;
            margin: 0 auto;
            font-size: 0.8em;
            color: #8f98a0;
        }
        
        /* Contenedor SVG */
        .svg-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        svg {
            background-color: #12151a;
            border: 1px solid #2a475e;
            border-radius: 4px;
        }
        
        /* Elementos SVG */
        .svg-peg { fill: #67707b; }
        .svg-bola {
            fill: #a4d007;
            transition: cx 0.2s linear, cy 0.2s linear;
        }
        .svg-texto-letra {
            fill: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-anchor: middle;
            user-select: none;
        }
        .svg-texto-prob {
            fill: #8f98a0;
            font-size: 10px;
            text-anchor: middle;
            user-select: none;
        }
        .svg-separador {
            stroke: #2a475e;
            stroke-width: 2;
        }

        /* Footer Captcha */
        .ingresados-box {
            text-align: center;
            letter-spacing: 5px;
            font-size: 1.2em;
            margin: 15px 0;
            min-height: 25px;
            color: #a4d007;
            font-weight: bold;
        }
        #mensaje { text-align: center; font-weight: bold; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- PASO 1 -->
    <div id="paso-formulario">
        <h2>Steam - Recuperación de cuenta</h2>
        <div class="form-group">
            <label>Nombre de la cuenta de Steam</label>
            <input type="text" id="steam-user" placeholder="Ej: gabe_newell">
        </div>
        <div class="form-group">
            <label>Dirección de email</label>
            <input type="email" id="steam-email" placeholder="Ej: gabe@valvesoftware.com">
        </div>
        <button id="btn-buscar">Buscar cuenta</button>
    </div>

    <!-- PASO 2 -->
    <div id="paso-captcha">
        <h2>Verificación biométrica</h2>
        <div class="objetivo-box">OBJETIVO: <span id="objetivo-txt">---</span></div>
        
        <!-- Slider de Posición -->
        <div class="controles-slider">
            <label for="inicio-slider">Punto de caída:</label>
            <input type="range" id="inicio-slider" min="-1" max="1" value="0" step="1">
            <div class="slider-labels">
                <span>Izq</span>
                <span>Centro</span>
                <span>Der</span>
            </div>
        </div>

        <div class="svg-container">
            <svg id="galton-svg" width="320" height="300" viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        
        <div class="ingresados-box">INGRESO: <span id="ingresados-txt"></span></div>
        <button id="btn-soltar">Soltar bola</button>
        <div id="mensaje"></div>
    </div>
</div>

<script>
    const estado = {
        objetivo: [],
        ingresados: [],
        cayendo: false,
        posicionInicio: 0, // Nuevo estado del slider
        letras: ['A', 'B', 'C', 'D', 'E'],
        probs: ['6.25%', '25%', '37.5%', '25%', '6.25%']
    };

    const config = {
        filas: 4,
        tiempoPaso: 200, 
        svgWidth: 320,
        svgHeight: 300,
        startY: 40,
        distY: 45, 
        separacionX: 45, 
        bolaRadio: 6,
        pegRadio: 4
    };

    const dom = {
        pasoForm: document.getElementById('paso-formulario'),
        pasoCaptcha: document.getElementById('paso-captcha'),
        btnBuscar: document.getElementById('btn-buscar'),
        btnSoltar: document.getElementById('btn-soltar'),
        slider: document.getElementById('inicio-slider'),
        svg: document.getElementById('galton-svg'),
        objTxt: document.getElementById('objetivo-txt'),
        ingTxt: document.getElementById('ingresados-txt'),
        mensaje: document.getElementById('mensaje')
    };

    let bolaSvg = null;

    function init() {
        dibujarTableroSVG();
        dom.btnBuscar.addEventListener('click', iniciarCaptcha);
        dom.btnSoltar.addEventListener('click', soltarBola);
        
        // Listener del slider para mover la bola en reposo
        dom.slider.addEventListener('input', (e) => {
            estado.posicionInicio = parseInt(e.target.value);
            actualizarPosicionBola();
        });
    }

    function iniciarCaptcha() {
        dom.pasoForm.style.display = 'none';
        dom.pasoCaptcha.style.display = 'block';
        generarObjetivo();
    }

    function dibujarTableroSVG() {
        dom.svg.innerHTML = ''; 
        const centroX = config.svgWidth / 2;

        for (let f = 0; f < config.filas; f++) {
            const numPegs = f + 1;
            const y = config.startY + (f * config.distY);
            for (let p = 0; p < numPegs; p++) {
                const offset = (p - (f / 2)) * config.separacionX;
                const peg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                peg.setAttribute("cx", centroX + offset);
                peg.setAttribute("cy", y);
                peg.setAttribute("r", config.pegRadio);
                peg.setAttribute("class", "svg-peg");
                dom.svg.appendChild(peg);
            }
        }

        const yCanaletasInicio = config.startY + (config.filas * config.distY);
        for (let i = 0; i < estado.letras.length; i++) {
            const offsetDestino = (i - (config.filas / 2)) * config.separacionX;
            const centroCanaletaX = centroX + offsetDestino;

            if (i > 0) {
                const linea = document.createElementNS("http://www.w3.org/2000/svg", "line");
                const xSeparador = centroCanaletaX - (config.separacionX / 2);
                linea.setAttribute("x1", xSeparador);
                linea.setAttribute("y1", yCanaletasInicio);
                linea.setAttribute("x2", xSeparador);
                linea.setAttribute("y2", config.svgHeight);
                linea.setAttribute("class", "svg-separador");
                dom.svg.appendChild(linea);
            }

            const txtLetra = document.createElementNS("http://www.w3.org/2000/svg", "text");
            txtLetra.setAttribute("x", centroCanaletaX);
            txtLetra.setAttribute("y", yCanaletasInicio + 30);
            txtLetra.setAttribute("class", "svg-texto-letra");
            txtLetra.textContent = estado.letras[i];
            dom.svg.appendChild(txtLetra);

            const txtProb = document.createElementNS("http://www.w3.org/2000/svg", "text");
            txtProb.setAttribute("x", centroCanaletaX);
            txtProb.setAttribute("y", yCanaletasInicio + 50);
            txtProb.setAttribute("class", "svg-texto-prob");
            txtProb.textContent = estado.probs[i];
            dom.svg.appendChild(txtProb);
        }

        bolaSvg = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        bolaSvg.setAttribute("r", config.bolaRadio);
        bolaSvg.setAttribute("class", "svg-bola");
        bolaSvg.style.display = "none";
        dom.svg.appendChild(bolaSvg);
    }

    function actualizarPosicionBola() {
        if (!bolaSvg || estado.cayendo) return;
        const centroX = config.svgWidth / 2;
        // Desplaza la posición inicial basándose en el valor del slider (-1, 0, 1)
        const xInicial = centroX + (estado.posicionInicio * config.separacionX);
        bolaSvg.style.transition = 'none';
        bolaSvg.setAttribute("cx", xInicial);
        bolaSvg.setAttribute("cy", config.startY - 20);
        bolaSvg.style.display = "block";
    }

    function generarObjetivo() {
        estado.objetivo = Array.from({length: 3}, () => estado.letras[Math.floor(Math.random() * 5)]);
        dom.objTxt.textContent = estado.objetivo.join(' ');
        estado.ingresados = [];
        
        // Resetear slider y UI
        estado.posicionInicio = 0;
        dom.slider.value = 0;
        dom.slider.disabled = false;
        dom.btnSoltar.disabled = false;
        dom.mensaje.style.display = 'none';
        
        actualizarIngresados();
        actualizarPosicionBola();
    }

    function actualizarIngresados() {
        dom.ingTxt.textContent = estado.ingresados.join(' ') || '- - -';
    }

    function soltarBola() {
        if (estado.cayendo || estado.ingresados.length >= 3) return;
        
        estado.cayendo = true;
        dom.btnSoltar.disabled = true;
        dom.slider.disabled = true; // REGLA DEFENSIVA: Bloquear slider en el aire
        dom.mensaje.style.display = 'none'; 
        
        let posVirtual = estado.posicionInicio; // La caída hereda el sesgo del slider
        let filaActual = 0;
        const centroX = config.svgWidth / 2;
        
        actualizarPosicionBola(); // Asegurar punto de inicio visual
        bolaSvg.getBoundingClientRect(); // Forzar reflow
        
        bolaSvg.style.transition = `cx ${config.tiempoPaso/1000}s linear, cy ${config.tiempoPaso/1000}s linear`;

        const bajarPaso = () => {
            if (filaActual < config.filas) {
                const der = Math.random() > 0.5 ? 1 : 0;
                posVirtual += der; // Suma la decisión aleatoria sobre el sesgo inicial
                
                const y = config.startY + (filaActual * config.distY);
                const offset = (posVirtual - (filaActual / 2)) * config.separacionX;
                const x = centroX + offset;

                bolaSvg.setAttribute("cx", x);
                bolaSvg.setAttribute("cy", y);
                
                filaActual++;
                setTimeout(bajarPaso, config.tiempoPaso);
            } else {
                const yFinal = config.startY + (config.filas * config.distY) + 20; 
                bolaSvg.setAttribute("cy", yFinal);
                
                // Clampear el resultado para que no caiga fuera de las 5 canaletas (0 a 4)
                let indiceFinal = posVirtual;
                if (indiceFinal < 0) indiceFinal = 0;
                if (indiceFinal > 4) indiceFinal = 4;

                setTimeout(() => finalizarCaida(indiceFinal), config.tiempoPaso);
            }
        };
        setTimeout(bajarPaso, 50);
    }

    function finalizarCaida(indiceCanaleta) {
        bolaSvg.style.display = 'none';
        estado.cayendo = false;
        
        estado.ingresados.push(estado.letras[indiceCanaleta]);
        actualizarIngresados();

        if (estado.ingresados.length === 3) {
            verificar();
        } else {
            dom.btnSoltar.disabled = false;
            dom.slider.disabled = false; // Reactivar slider para la siguiente bola
            actualizarPosicionBola(); // Volver a mostrar la bola arriba
        }
    }

    function verificar() {
        if (estado.objetivo.join('') === estado.ingresados.join('')) {
            dom.mensaje.textContent = "Verificación exitosa. Redirigiendo...";
            dom.mensaje.style.color = "#a4d007"; 
            dom.mensaje.style.display = "block";
        } else {
            dom.mensaje.textContent = "Error biométrico. Reiniciando secuencia...";
            dom.mensaje.style.color = "#ff4c4c"; 
            dom.mensaje.style.display = "block";
            setTimeout(generarObjetivo, 2000);
        }
    }

    window.onload = init;
</script>
</body>
</html>
