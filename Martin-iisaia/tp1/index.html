<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Guard - Verificación</title>
    <style>
        /* Estética clon de Steam */
        body {
            font-family: Arial, sans-serif;
            background-color: #1b2838;
            color: #c7d5e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .steam-container {
            background-color: #171a21;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            width: 320px;
            text-align: center;
            border: 1px solid #2a475e;
        }
        h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 1.3em;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid #2a475e;
            padding-bottom: 10px;
        }
        .instruction {
            color: #8f98a0;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        .target-pin {
            font-weight: bold;
            color: #66c0f4;
            font-size: 1.4em;
            letter-spacing: 4px;
            display: block;
            margin-top: 5px;
        }
        /* Pantalla del PIN */
        .display {
            background-color: #323e4c;
            border: 1px solid #1b2838;
            border-radius: 3px;
            height: 50px;
            font-size: 2em;
            letter-spacing: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: #ffffff;
            overflow: hidden;
        }
        /* Teclado */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        button {
            background-color: #2a475e;
            border: none;
            border-radius: 2px;
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: #c7d5e0;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.1s;
        }
        button:hover {
            background-color: #3c4958;
            color: #ffffff;
        }
        button:active {
            background-color: #1b2838;
        }
        
        /* Botones especiales */
        .btn-delete {
            background-color: #4a2a2a;
            color: #ff5c5c;
        }
        .btn-delete:hover {
            background-color: #5a3a3a;
        }
        .btn-submit {
            background: linear-gradient(to right, #47bfff 5%, #1a44c2 60%);
            background-size: 330% 100%;
            background-position: 25%;
            color: white;
            transition: background-position 0.3s;
        }
        .btn-submit:hover {
            background-position: 0%;
            color: white;
        }

        .msg {
            margin-top: 15px;
            font-weight: bold;
            height: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<div class="steam-container">
    <h2>Steam Guard</h2>
    <p class="instruction">Introduce el código del Autenticador Móvil:<br><span class="target-pin" id="target-pin">---</span></p>
    
    <div class="display" id="display"></div>
    
    <div class="keypad">
        <button class="key-heavy" data-val="1">1</button>
        <button class="key-chatter" data-val="2">2</button>
        <button class="key-normal" data-val="3">3</button>
        <button class="key-heavy" data-val="4">4</button>
        <button class="key-chatter" data-val="5">5</button>
        <button class="key-normal" data-val="6">6</button>
        <button class="key-heavy" data-val="7">7</button>
        <button class="key-chatter" data-val="8">8</button>
        <button class="key-normal" data-val="9">9</button>
        <button class="btn-delete" id="btn-delete">DEL</button>
        <button class="key-normal" data-val="0">0</button>
        <button class="btn-submit" id="btn-submit">OK</button>
    </div>
    
    <div class="msg" id="msg"></div>
</div>

<script>
    const estado = {
        objetivo: "",
        ingresado: "",
        tiempoInicioPress: 0
    };

    const dom = {
        targetPin: document.getElementById('target-pin'),
        display: document.getElementById('display'),
        msg: document.getElementById('msg'),
        btnDelete: document.getElementById('btn-delete'),
        btnSubmit: document.getElementById('btn-submit')
    };

    function init() {
        generarObjetivo();
        configurarTecladoDefectuoso();
    }

    function generarObjetivo() {
        // Forzamos un objetivo difícil (1 pesado, 5, 2, 8 con rebote)
        estado.objetivo = "1528"; 
        dom.targetPin.textContent = estado.objetivo;
        estado.ingresado = "";
        actualizarPantalla();
    }

    function actualizarPantalla() {
        dom.display.textContent = "•".repeat(estado.ingresado.length);
    }

    function agregarDigito(val) {
        if (estado.ingresado.length < 4) {
            estado.ingresado += val;
            actualizarPantalla();
        }
    }

    function configurarTecladoDefectuoso() {
        // 1. Teclas "Actuación Pesada" (1, 4, 7)
        document.querySelectorAll('.key-heavy').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                estado.tiempoInicioPress = Date.now();
            });
            btn.addEventListener('mouseup', (e) => {
                const duracion = Date.now() - estado.tiempoInicioPress;
                if (duracion >= 800 && duracion < 1200) {
                    agregarDigito(e.target.dataset.val);
                } else if (duracion >= 1200) {
                    agregarDigito(e.target.dataset.val);
                    agregarDigito(e.target.dataset.val);
                }
            });
            btn.addEventListener('mouseleave', () => estado.tiempoInicioPress = 0);
        });

        // 2. Teclas "Key Chatter" (2, 5, 8)
        document.querySelectorAll('.key-chatter').forEach(btn => {
            btn.addEventListener('click', (e) => {
                agregarDigito(e.target.dataset.val);
                if (Math.random() < 0.40 && estado.ingresado.length < 4) {
                    setTimeout(() => agregarDigito(e.target.dataset.val), 50); 
                }
            });
        });

        // 3. Teclas Normales (3, 6, 9, 0)
        document.querySelectorAll('.key-normal[data-val]').forEach(btn => {
            btn.addEventListener('click', (e) => agregarDigito(e.target.dataset.val));
        });

        // 4. El Castigo: Borrar requiere DOBLE CLIC
        dom.btnDelete.addEventListener('click', () => {
            dom.display.style.opacity = "0.4";
            setTimeout(() => dom.display.style.opacity = "1", 100);
        });
        dom.btnDelete.addEventListener('dblclick', () => {
            estado.ingresado = estado.ingresado.slice(0, -1);
            actualizarPantalla();
        });

        // Validar
        dom.btnSubmit.addEventListener('click', () => {
            if (estado.ingresado === estado.objetivo) {
                dom.msg.textContent = "SESIÓN INICIADA.";
                dom.msg.style.color = "#a4d007"; // Verde Steam
            } else {
                dom.msg.textContent = "CÓDIGO INCORRECTO.";
                dom.msg.style.color = "#ff5c5c";
                estado.ingresado = "";
                setTimeout(() => {
                    dom.msg.textContent = "";
                    generarObjetivo(); 
                }, 1500);
            }
        });
    }

    window.onload = init;
</script>
</body>
</html>
